name: Build AIPlayer Fabric

on:
  push:
    branches: [ "main", "feature/blocky-player-prototype" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Verify Java and Gradle
        run: |
          java -version
          gradle --version
      - name: Compile and package
        run: gradle clean build --no-daemon --stacktrace
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: AIPlayer-Fabric-1.21.11
          path: build/libs/aiplayer-*.jar
          if-no-files-found: error
